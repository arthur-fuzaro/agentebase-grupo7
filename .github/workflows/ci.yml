# Esteira de build, teste e deploy do agente.
#
#   build -> test-unit -> test-contrato -> test-run-level -> test-smoke -> test-eval -> deploy
#
# Em todo PR rodam só os jobs sem custo: build e testes sem API real
# (o cliente da OpenAI é um dublê no run-level).
#
# Em push na main ou disparo manual rodam também:
#   - test-smoke: integração real com a OpenAI;
#   - test-eval:  evals do agente publicado (agent.md) e das personas.
# Os dois falham se OPENAI_API_KEY faltar, para nunca ficarem verdes sem testar.
#
# O deploy só roda na main e só se todos os jobs anteriores passarem.
# Critérios completos em docs/PLANO_DE_TESTES.md.

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Checar sintaxe (py_compile)
        run: python -m py_compile agent.py app.py

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check agent.py app.py

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes unitários (somar, executar_ferramenta, carregar_contexto, roteador)
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -m unitario -vv -s

  test-contrato:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes de contrato (FERRAMENTAS vs. código Python)
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -m contrato -vv -s

  test-run-level:
    needs: test-contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes run-level (responder(), cliente da OpenAI dublado)
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -m run_level -vv -s

  test-smoke:
    needs: test-run-level
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTE_TEMPERATURA: "0.2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Checar OPENAI_API_KEY
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::Secret OPENAI_API_KEY não configurado: o smoke seria pulado sem testar."; exit 1; }

      - name: Smoke test (API real da OpenAI)
        run: pytest -m smoke -vv -s

  test-eval:
    needs: test-smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTE_TEMPERATURA: "0.2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Checar OPENAI_API_KEY
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::Secret OPENAI_API_KEY não configurado: o eval seria pulado sem testar."; exit 1; }

      - name: Evals (agente publicado e personas, API real)
        run: pytest -m eval -vv -s

  deploy:
    needs: test-eval
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-azure.yml
    secrets: inherit
